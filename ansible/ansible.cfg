[defaults]
interpreter_python=/usr/bin/python3
inventory      = ./inventory
timeout = 30

#ansible_user: guru
remote_user = bjorn
collections_path = ./collections/ansible_collections

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=2m

[privilege_escalation]
become=True
become_method=sudo
become_user=root
become_ask_pass=False
